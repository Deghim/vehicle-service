spring.application.name=vehicle-service
server.port=${SERVER_PORT:18081}
spring.datasource.url=${VEHICLE_DB_URL:jdbc:postgresql://localhost:5432/vehicle_db}
spring.datasource.username=${VEHICLE_DB_USER:postgres}
spring.datasource.password=${VEHICLE_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.time-zone=UTC
